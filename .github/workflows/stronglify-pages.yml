# Generado por stronglify-cli (stronglify github pages). No editar a mano:
# se sobrescribe al volver a ejecutar el comando.
name: Deploy Stronglify site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: Rewrite cacao.com URLs to the Pages URL
        env:
          DOMAIN_PATTERN: 'https?://(www\.)?cacao\.com'
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          find . -path ./.git -prune -o -path ./.github -prune -o -type f \( -name '*.html' -o -name '*.xml' -o -name '*.txt' -o -name '*.css' -o -name '*.js' -o -name '*.json' -o -name '*.webmanifest' \) -print0 \
            | xargs -0 -r sed -i -E "s#${DOMAIN_PATTERN}#${BASE_URL}#g"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
